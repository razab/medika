<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Медика</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/account.css">
  <script type="module" src="/account.js"></script>
</head>
<body>
  <main>
    <header><img src="/icon.svg" alt="" width="36" height="36"><span>Медика</span></header>
    <h1>Войти</h1>
    <form id="account-form" method="post" action="/login">
      <label>Электронная почта<input id="login-email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required></label>
      <label>Пароль<input id="current-password" name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
      <p class="autofill-hint">Пароль подставлен. Нажмите «Войти».</p>
      <p id="account-error" role="alert"></p>
      <button type="submit">Войти</button>
      <button type="button" class="google-button" id="google-login" hidden><img src="/google-logo.png" width="18" height="18" alt="">Войти через Google</button>
    </form>
    <nav class="login-options" aria-label="Другие способы входа">
      <a class="secondary-action" href="/login/code">Войти по одноразовому коду</a>
      <a href="/register">Регистрация по приглашению</a>
    </nav>
  </main>
</body>
</html>
