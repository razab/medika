<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Медика</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/account.css">
  <script type="module" src="/account.js"></script>
</head>
<body>
  <main>
    <header><img src="/icon.svg" alt="" width="36" height="36"><span>Медика</span></header>
    <h1>Аккаунт</h1>
    <section id="account-details" hidden>
      <p id="account-name"></p>
      <p id="google-linked" hidden>Google подключён</p>
      <details id="google-link" hidden>
        <summary>Подключить Google</summary>
        <form id="google-link-form" method="post" action="/auth/google/start">
          <label>Пароль от Медики<input name="password" type="password" required autocomplete="current-password" maxlength="256"></label>
          <button type="submit" class="google-button"><img src="/google-logo.png" width="18" height="18" alt="">Продолжить с Google</button>
        </form>
      </details>
      <button type="button" id="account-logout">Выйти</button>
      <a href="/family">Семейный журнал</a>
    </section>
    <p id="account-error" role="alert"></p>
  </main>
</body>
</html>
