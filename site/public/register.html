<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация в Медике</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/account.css">
  <script type="module" src="/account.js"></script>
</head>
<body>
  <main>
    <header><img src="/icon.svg" alt="" width="36" height="36"><span>Медика</span></header>
    <h1>Создать аккаунт</h1>
    <form id="registration-form" method="post" action="/register">
      <label>Логин<input id="register-username" name="new-username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="40" required></label>
      <label>Пароль<input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="15" maxlength="256" required></label>
      <div>
        <div class="password-actions">
          <button type="button" id="generate-password">Сгенерировать пароль</button>
          <button type="button" id="copy-password" hidden>Скопировать пароль</button>
        </div>
        <p id="password-status" role="status"></p>
      </div>
      <label>Код приглашения<input id="register-invite" name="invite" autocomplete="off" autocapitalize="none" spellcheck="false" minlength="64" maxlength="64" required></label>
      <button type="submit">Создать аккаунт</button>
      <a href="/login">Уже есть аккаунт? Войти</a>
    </form>
    <p id="account-error" role="alert"></p>
  </main>
</body>
</html>
