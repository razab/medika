<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Медика · Playground</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/prescription-workspace.css"><script type="module" src="/ocr-lab.js"></script></head><body><header class="lab-header"><a href="/">← Медика</a><strong>Playground</strong><a href="/voice-lab">Голос</a><span id="lab-mode">Тестовый журнал</span></header><button id="preview-mode" class="preview-toggle" aria-label="Режим пользователя" title="Режим пользователя">⛶</button><details id="case-tools" open><summary>Файл и сохранённые тесты</summary><div class="case-toolbar"><select id="case-list" aria-label="Сохранённый тест"><option>Загрузка…</option></select><button id="new-case">＋ Выписка</button><button id="export-case" disabled>Экспорт</button><button id="delete-case" disabled>Удалить</button></div></details><section id="upload-panel" class="upload-panel"><form id="new-prescription"><label>Фото выписки<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><details><summary>Или вставить текст</summary><textarea name="text" rows="7" placeholder="Текст назначения врача"></textarea></details><div class="actions"><button type="submit" class="primary">Распознать и распределить</button><button id="demo-case" type="button">Сложный пример</button></div></form></section><main id="workspace"></main><p id="notice" role="status" aria-live="polite"></p></body></html>
